name: Update Macro Indicators

on:
  schedule:
    # 매일 22:00 UTC = 한국시간 07:00 (다음날)
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼용

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch macro indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_macro.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update macro indicators $(date -u +%Y-%m-%d)"
          git push
